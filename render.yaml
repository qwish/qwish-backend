services:
  - type: web
    name: qwish-backend
    runtime: go
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Passkey / WebAuthn (super-admin login). RP_ID must be the registrable
      # domain (e.g. qwish.in); RP_ORIGINS the exact admin origin(s) with scheme.
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_RP_ORIGINS
        sync: false
      - key: WEBAUTHN_RP_DISPLAY_NAME
        sync: false
      # Frontend URLs used in invite emails & generated links. Code defaults
      # already point here; set explicitly so ops can see/override per env.
      - key: SUPER_ADMIN_URL
        value: https://superadmin.qwish.in
      - key: INSTITUTE_DASHBOARD_URL
        value: https://institute.qwish.in
      - key: BRAND_URL
        value: https://qwish.in
